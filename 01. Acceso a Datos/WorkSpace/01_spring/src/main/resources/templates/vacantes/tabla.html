<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-wEmeIV1mKuiNpC+IOBjI7aAzPcEZeedi5yW5f2yOq55WWLwNGmvvx4Um1vskeMj0" crossorigin="anonymous">
    <title>Insert title here</title>
</head>

<body>
    <img th:src="@{/images/logo.png}" width="136" height="136">
    <h1 class="text-primary my-3">Lista de vacantes</h1>
    <table class="table table-striped table-bordered table-hover">
        <tr>
            <th>Logo</th>
            <th>Id</th>
            <th>Nombre</th>
            <th>Fecha de Pub</th>
            <th>Salario Ofrecido</th>
            <th>Descripcion</th>
            <th>Destacadas</th>
        </tr>
        <tr th:each="v : ${vacantes}">
            <td>
                <img th:src="@{/images/{name}(name=${v.imagen})}" width="136" height="136">
            </td>
            <td th:text="${v.id}"></td>
            <td th:text="${v.nombre}"></td>
            <td th:text="${v.fecha}"></td>
            <td th:text="${v.salario}"></td>
            <td th:text="${v.descripcion}"></td>
            <td>
                <span th:if="${v.destacado == 1}" class="badge bg-success">Sí</span>
                <span th:if="${v.destacado == 0}" class="badge bg-danger">No</span>
            </td>
        </tr>
    </table>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-p34f1UUtsS3wqzfto5wAAmdvj+osOnFyQFpp4Ua3gs/ZVWx6oOypYoCJhGGScy+8"
        crossorigin="anonymous"></script>
</body>

</html>
