<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
    <title>Insert title here</title>
</head>

<body>
    <div>
        <h1 class="text-primary my-3">Departamentos</h1>
        <table class="table table-striped table-bordered table-hover">
            <tr>
                <th>Imagen</th>
                <th>ID</th>
                <th>Nombre</th>
                <th>Localizacion</th>
            </tr>
            <tr th:each="dep : ${departamentos}">
                <td><img th:src="@{/img/{name}(name = ${dep.imagen})}" width="136" height="136"></td>
                <td th:text="${dep.id}"></td>
                <td th:text="${dep.nombre}"></td>
                <td th:text="${dep.localizacion}"></td>
            </tr>
        </table>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p"
        crossorigin="anonymous"></script>
</body>

</html>
