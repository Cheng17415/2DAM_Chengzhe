<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>

    <script th:inline="javascript">
        /*<![CDATA[*/
        var numero =/*[[${numero}]]*/ 0;
        document.write(numero);
        document.write('<h1 class="text-primary">Lista de Vacantes </h1>');
        document.write('<table class="table table-striped table-bordered table-hover">');
        document.write('<tr><th>numero</th></tr>');
        
        for(let i = 1; i<=10; i++){
			document.write("<tr>");
            document.write("<td>"+(i*numero)+"</td>");
			document.write("</tr>");
		}
        document.write("</table>");
        /*]]>*/
    </script>
</body>
</html>
