<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor Binario</title>

    <script>
        let vbinario, vbase, vresultado;

        function cargar() {
            vbinario = document.getElementById("binario");
            vbase = document.getElementById("base");
            vresultado = document.getElementById("resultado");
        }

        function bin_a_dec() {
            let cadena = vbinario.value;

            // Validación: solo 0 o 1
            if (!/^[01]+$/.test(cadena)) {
                vresultado.value = "Error";
                return null;
            }

            let res = 0, c = 0;
            for (let i = cadena.length - 1; i >= 0; i--) {
                res += parseInt(cadena[i]) * Math.pow(2, c++);
            }

            return res; // devolvemos el número
        }

        function bin_a_oct() {
            let n = bin_a_dec();
            if (n === null) return;

            vresultado.value = n.toString(8);
        }

        function bin_a_hex() {
            let n = bin_a_dec();
            if (n === null) return;

            vresultado.value = n.toString(16).toUpperCase();
        }

        function cambio() {
            switch (vbase.value) {
                case "Decimal":
                    let n = bin_a_dec();
                    if (n !== null) vresultado.value = n;
                    break;
                case "Octal":
                    bin_a_oct();
                    break;
                case "Hexadecimal":
                    bin_a_hex();
                    break;
            }
        }
    </script>

    <style>
        div {
            width: 400px;
            margin: 20px auto;
            padding: 20px;
            border: 2px solid gold;
            border-radius: 10px;
        }
    </style>
</head>

<body onload="cargar()">
    <div>
        <p>
            <label>Binario</label>
            <input onchange="cambio()" type="text" id="binario">
        </p>

        <p>
            <label>Cambio de base</label>
            <select onchange="cambio()" id="base">
                <option value="Decimal">Decimal</option>
                <option value="Octal">Octal</option>
                <option value="Hexadecimal">Hexadecimal</option>
            </select>
        </p>

        <p>
            <label>Resultado</label>
            <input type="text" id="resultado" disabled>
        </p>
    </div>
</body>
</html>
